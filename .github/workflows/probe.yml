name: Probe image path
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/samples
          curl -sL -A "Mozilla/5.0" https://www.usdalocalfoodportal.com/listings/jsmy/js_utilities.js -o data/samples/js_utilities.js
          curl -sL -A "Mozilla/5.0" "https://www.usdalocalfoodportal.com/fe/flisting/?lid=15142&directory_type=agritourism" | grep -i "image_path\|js_\|\.js" > data/samples/page_js.txt || true
          git config user.name "farmdaytrips-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/samples; git commit -m "Probe image path" || true; git pull --rebase; git push
