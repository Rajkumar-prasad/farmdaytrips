name: Probe USDA endpoints
on:
  push:
    paths: [".github/workflows/probe.yml", "scripts/probe-usda.mjs"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-usda.mjs
      - run: |
          git config user.name "farmdaytrips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/samples
          git diff --cached --quiet || git commit -m "Probe samples"
          git pull --rebase && git push
