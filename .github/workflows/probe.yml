name: Probe image path
on:
  push:
    paths: [".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/samples
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sL -A "$UA" -e "https://www.usdalocalfoodportal.com/" https://www.usdalocalfoodportal.com/listings/jsmy/js_utilities.js -o data/samples/js_utilities.js
          curl -sL -A "$UA" -e "https://www.usdalocalfoodportal.com/" "https://www.usdalocalfoodportal.com/fe/flisting/?lid=15142&directory_type=agritourism" -o data/samples/page.html
          git config user.name "farmdaytrips-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/samples; git commit -m "Probe image path 2" || true; git pull --rebase; git push
