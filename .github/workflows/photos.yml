name: Download listing photos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/photos.yml"

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp@0.33
      - run: PHOTOS_ONLY=1 node scripts/enrich-usda.mjs
      - name: Commit photos
        run: |
          git config user.name "farmdaytrips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/enrich src/photos
          git diff --cached --quiet || git commit -m "Update listing photos"
          git pull --rebase
          git push
