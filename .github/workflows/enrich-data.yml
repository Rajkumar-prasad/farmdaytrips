name: Enrich listings (contacts, hours, photos)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/enrich-usda.mjs"
      - ".github/workflows/enrich-data.yml"
      - "data/config.json"
  schedule:
    - cron: "37 5 2 * *" # monthly, the day after the USDA data refresh

permissions:
  contents: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp@0.33
      - run: node scripts/enrich-usda.mjs
      - name: Commit results
        run: |
          git config user.name "farmdaytrips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/enrich src/photos data/photo-scores.json
          git diff --cached --quiet || git commit -m "Update listing details and photos"
          git pull --rebase
          git push
