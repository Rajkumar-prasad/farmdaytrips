name: Fetch USDA farm data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *" # monthly refresh

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-usda.mjs
      - name: Commit data
        run: |
          git config user.name "farmdaytrips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/usda.json data/usda-report.json
          git diff --cached --quiet || git commit -m "Update USDA data"
          git push
